server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use a wildcard to catch the project name even if Docker removed underscores
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '.*qtech.*'
        action: keep
      # Extract the specific container service name (app or nginx)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'