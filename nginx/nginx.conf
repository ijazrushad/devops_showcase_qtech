http {
    upstream backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name app.18.143.227.177.nip.io;

        # Needed for Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host:5119$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name app.18.143.227.177.nip.io;

        ssl_certificate /etc/letsencrypt/live/app.18.143.227.177.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.18.143.227.177.nip.io/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}