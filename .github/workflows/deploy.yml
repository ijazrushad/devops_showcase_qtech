name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Code Quality & Testing
  quality-checks:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  # JOB 2: Container Security Scan & Build
  build-scan-push:
    name: Build, Scan & Push Docker Image
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build Docker Image (Local)
        uses: docker/build-push-action@v4
        with:
          context: ./app
          load: true # Loads image into local Docker daemon for scanning
          tags: qtec-api:local

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qtec-api:local'
          format: 'table'
          # Set exit-code to 1 to fail the pipeline if HIGH/CRITICAL CVEs are found
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qtec-api:latest

  # JOB 3: Zero-Downtime Deployment
  deploy:
    name: Deploy to AWS EC2
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via AWS Systems Manager
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /home/ubuntu/devops_showcase_qtech",
              "cd /home/ubuntu/devops_showcase_qtech",
              "if [ ! -d \".git\" ]; then git clone https://github.com/${{ github.repository }}.git .; else git pull origin main; fi",
              "export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}",
              "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin",
              "docker compose pull app",
              "docker compose up -d --no-deps --build app",
              "docker compose up -d"
            ]' \
            --comment "Secure Deployment Pipeline Executed"